<!doctype html>
<meta charset="utf-8">
<title>__NAME__</title>
<link rel="icon" href="data:,">
<style>
  /* The popups of Pi's ask_user and show_html take the page's colours and font. */
  #dolly { --dolly-html-background: #262626; --dolly-html-color: #e8e3d7; --dolly-html-accent: #f2d45c;
    --dolly-html-font: ui-monospace, monospace; --dolly-html-color-scheme: dark; }
</style>
<main id="dolly" style="position:fixed;inset:0"></main>
<script type="module">
  import { boot } from "./node_modules/@daugasauron/dolly/src/browser.mjs";
  import { images, image, modules } from "./__NAME__/index.mjs";

  // The hosts the agent may reach, and nothing else: the model's provider here,
  // one rule per host the agent needs (api.github.com, pypi.org). A rule names an
  // origin, its paths and methods, and the header that carries the key (docs/http.md
  // in @daugasauron/dolly). Hosts without CORS headers go through serve.mjs's relay
  // (docs/agent-frontend.md).
  const policy = { rules: [
    { origin: "https://openrouter.ai", pathPrefix: "/api/v1/", methods: ["GET", "POST"], credentialHeaders: ["authorization"] },
    // { origin: "https://api.anthropic.com", pathPrefix: "/v1/", methods: ["POST"], credentialHeaders: ["x-api-key"] },
  ] };

  // The project: workspace/ is written into /workspace at each boot, so an edit
  // there is a reload. serve.mjs answers workspace.json, the paths under workspace/;
  // a static host holds that file. Pi's tools can read these files; they are not
  // for secrets.
  const listing = await fetch("./workspace.json");
  if (!listing.ok) throw new Error("workspace.json must list the files under workspace/, as serve.mjs does");
  const files = {};
  await Promise.all((await listing.json()).map(async path => {
    const url = `./workspace/${path.split("/").map(encodeURIComponent).join("/")}`;
    files[`/workspace/${path}`] = new Uint8Array(await (await fetch(url)).arrayBuffer());
  }));
  // Pi's colours: theme.json (Pi's docs/themes.md), written over the image's theme.
  files["/home/dolly/.pi/agent/themes/dolly.json"] = await (await fetch("./theme.json")).text();

  // Save (Ctrl+Shift+S) keeps the sandbox's state in this browser and names it in the
  // address, ?session=NAME: the page then opens that save, as it was, in place of a fresh start.
  const session = new URLSearchParams(location.search).get("session") ?? undefined;
  await boot(document.querySelector("#dolly"), { images, image, modules, http: { policy }, files, session });
</script>
