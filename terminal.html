<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Dolly</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #262626;
        color: #e8e3d7;
        font-family: "Dolly IosevkaTerm SemiBold", monospace;
      }
      #terminal { width: 100%; height: calc(100% - var(--buttons-height, 0px)); }
      #terminal > pre { margin: 1rem; white-space: pre-wrap; font: 600 20px/1.35 monospace; }
      /* The strip of buttons@0 lies below the terminal and the page's indicators. */
      .page-indicator { translate: 0 calc(0px - var(--buttons-height, 0px)); }
      #buttons { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: #262626;
        border-top: 1px solid #77736c; font-size: 15px; touch-action: none; }
      /* A caption longer than four lines shows its last four. */
      #buttons p { display: flex; flex-direction: column; justify-content: flex-end; margin: 0 0 6px; max-height: 5.2em;
        overflow: hidden; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
      #buttons p[hidden] { display: none; }
      #buttons div { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
      #buttons button { min-height: 48px; padding: 2px; color: inherit; background: #333; border: 1px solid #77736c;
        border-radius: 6px; font: inherit; overflow-wrap: anywhere; }
      #buttons button[data-paste] { border-color: #f2d45c; }
    </style>
  </head>
  <body>
    <main id="terminal" aria-label="Dolly shell terminal"><pre id="bootstrap-log"></pre></main>
    <script>globalThis.DOLLY_BOOT = Object.freeze({ image: "{{DOLLY_IMAGE}}", mode: "{{DOLLY_MODE}}", loadSession: {{DOLLY_LOAD_SESSION}} });</script>
    <script type="module">
      const assets = new URL("{{DOLLY_BASE}}", document.baseURI);
      const terminal = document.querySelector("#terminal");
      const failed = text => {
        terminal.firstElementChild.textContent = `FATAL\n${text}\n`;
        document.documentElement.dataset.dollyStatus = "failed";
      };
      if (crossOriginIsolated) {
        sessionStorage.removeItem("dolly-isolation-retry");
        // The site is an embedding: it offers every host module this repository
        // builds, and takes once what a test set before the page loaded.
        const { DOLLY_BOOT: route, DOLLY_HOST_MODULES: hostModules, DOLLY_HTTP_POLICY: policy, DOLLY_HTTP_RELAYS: relays } = globalThis;
        for (const name of ["DOLLY_HOST_MODULES", "DOLLY_HTTP_POLICY", "DOLLY_HTTP_RELAYS"]) delete globalThis[name];
        let boot, hostModuleUrls;
        try {
          [{ boot }, { hostModuleUrls }] = await Promise.all(["src/browser.mjs", "host/manifests.mjs"]
            .map(path => import(new URL(path, assets).href)));
        } catch (error) {
          failed(`Dolly failed to load.\n${error instanceof Error ? error.stack ?? error.message : String(error)}`);
        }
        // boot() shows its own failure in the terminal.
        if (boot) window.__dolly = await boot(terminal, { ...route, modules: hostModuleUrls, hostModules,
          http: { policy, relays } }).catch(error => console.error(error));
      } else if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register(new URL("coi-serviceworker.js", assets), { scope: assets.pathname });
        if (!navigator.serviceWorker.controller) {
          await navigator.serviceWorker.ready;
          location.reload();
        } else if (sessionStorage.getItem("dolly-isolation-retry") !== "1") {
          sessionStorage.setItem("dolly-isolation-retry", "1");
          location.reload();
        } else {
          failed("Dolly could not establish cross-origin isolation.");
        }
      } else {
        failed("Dolly requires cross-origin isolation and service workers are unavailable.");
      }
    </script>
  </body>
</html>
