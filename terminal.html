<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {{DOLLY_ROUTE_HEAD}}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Dolly</title>
    <style>
      @font-face {
        font-family: "Dolly IosevkaTerm SemiBold";
        src: url("{{DOLLY_BASE}}dist/IosevkaTerm-SemiBold.woff2") format("woff2");
        font-style: normal;
        font-weight: 600;
        font-display: block;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #262626;
        color: #e8e3d7;
        font-family: "Dolly IosevkaTerm SemiBold", monospace;
      }
      #terminal {
        position: relative;
        width: 100%;
        height: 100%;
        outline: none;
        overflow: hidden;
        caret-color: transparent;
      }
      #display {
        display: block;
        width: 100%;
        height: 100%;
        cursor: text;
        touch-action: none;
      }
      #display[hidden] { display: none; }
      #keyboard {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        caret-color: transparent;
      }
      #bootstrap-log {
        position: absolute;
        inset: 0;
        z-index: 1;
        margin: 0;
        padding: 1rem 1.15rem;
        overflow: auto;
        white-space: pre-wrap;
        color: #e8e3d7;
        background: #262626;
        font: 600 20px/1.35 "Dolly IosevkaTerm SemiBold", monospace;
        scrollbar-width: thin;
        scrollbar-color: #f2d45c #262626;
      }
      #bootstrap-log[hidden] { display: none; }
      #session-status {
        position: fixed; right: 1rem; top: 1rem; z-index: 5;
        max-width: calc(100vw - 2rem); padding: 0.5rem 0.75rem;
        background: #262626; border: 1px solid #77736c; font-size: 14px;
      }
      #session-open { position: fixed; right: 0.5rem; bottom: 0.35rem; z-index: 6;
        padding: 0.15rem 0.45rem; color: inherit; background: #262626;
        border: 1px solid #77736c; font: inherit; font-size: 13px; cursor: pointer; }
      #session-open[data-failed] { border-color: #e98773; }
      #session-dialog { width: min(420px, calc(100vw - 2rem)); padding: 1.2rem;
        background: #262626; color: inherit; border: 1px solid #77736c; font: inherit; }
      #session-dialog::backdrop { background: #0008; }
      #session-dialog h2 { margin: 0 0 1rem; font-size: 20px; }
      #session-dialog p { font-size: 14px; line-height: 1.5; }
      #session-dialog label { display: block; margin: 1rem 0 0.4rem; }
      #session-dialog input { width: 100%; padding: 0.4rem; font: inherit;
        color: inherit; background: #191919; border: 1px solid #77736c; }
      #session-dialog button { padding: 0.35rem 0.65rem; font: inherit;
        color: inherit; background: #333; border: 1px solid #77736c; cursor: pointer; }
      #session-dialog a { color: #f2d45c; }
      #session-dialog nav { display: flex; gap: 0.6rem; align-items: center; margin-top: 1rem; }
      #session-dialog nav a { margin-right: auto; font-size: 14px; }
      #file-upload { background: #262626; color: #e8e3d7; border: 1px solid #77736c;
        max-width: calc(100vw - 2rem); font: inherit; }
      #file-upload::backdrop { background: #0008; }
      #file-upload input, #file-upload button { font: inherit; }
      #image-build { position: fixed; right: 0.6rem; bottom: 0.6rem; z-index: 7;
        width: min(520px, calc(100vw - 1.2rem)); max-height: calc(100vh - 1.2rem); overflow: auto;
        background: #262626; border: 1px solid #f2d45c; padding: 0.75rem; font-size: 15px; }
      #image-build[hidden], #image-build [hidden] { display: none; }
      #image-build p { margin: 0 0 0.6rem; }
      #image-build details { margin-bottom: 0.6rem; }
      #image-build pre { max-height: 40vh; overflow: auto; white-space: pre-wrap; font: inherit; }
      #image-build button { color: inherit; background: inherit; border: 1px solid #77736c; font: inherit; cursor: pointer; }
      @media (max-width: 640px) {
        #bootstrap-log { padding: 0.65rem 0.75rem; }
      }
    </style>
  </head>
  <body>
    <main id="terminal" aria-label="Dolly shell terminal">
      <canvas id="display" hidden aria-label="Dolly sandbox framebuffer"></canvas>
      <textarea id="keyboard" aria-label="Dolly keyboard input"
        autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <pre id="bootstrap-log" aria-live="polite"></pre>
    </main>
    <div id="session-status" role="status" hidden></div>
    <button id="session-open" type="button" aria-label="Save session" title="Save session (Ctrl+Shift+S)" hidden>Save</button>
    <dialog id="session-dialog" aria-labelledby="session-title">
      <form id="session-form">
        <h2 id="session-title">Save session</h2>
        <p id="session-detail" role="status"></p>
        <p>Keep the program’s latest checkpoint, files and agent history in this browser.
          Save again to keep later changes.</p>
        <label for="session-name">Session name</label>
        <input id="session-name" name="name" required minlength="1" maxlength="64"
          pattern="[A-Za-z0-9._\-]+" autocomplete="off" spellcheck="false">
        <nav>
          <a id="session-list" target="_blank" rel="noopener">Saved sessions ↗</a>
          <button id="session-close" type="button">Close</button>
          <button id="session-save" type="submit">Save</button>
        </nav>
      </form>
    </dialog>
    <script>globalThis.DOLLY_BOOT = Object.freeze({ image: "{{DOLLY_IMAGE}}", mode: "{{DOLLY_MODE}}", loadSession: {{DOLLY_LOAD_SESSION}} });</script>
    <script type="module">
      const assets = new URL("{{DOLLY_BASE}}", document.baseURI);
      if (globalThis.DOLLY_NOT_FOUND) {
        document.body.textContent = "Not found. Return to the Dolly home page.";
      } else if (crossOriginIsolated) {
        sessionStorage.removeItem("dolly-isolation-retry");
        try {
          await import(new URL("src/browser.mjs", assets).href);
        } catch (error) {
          const detail = error instanceof Error
            ? error.stack ?? error.message
            : String(error);
          document.querySelector("#bootstrap-log").textContent =
            `FATAL\nDolly failed to load.\n${detail}\n`;
          document.documentElement.dataset.dollyStatus = "failed";
        }
      } else if ("serviceWorker" in navigator) {
        const publicRoot = new URL(assets);
        publicRoot.pathname = publicRoot.pathname.replace(/_dolly\/[0-9a-f]{64}\/$/, "");
        await navigator.serviceWorker.register(new URL("coi-serviceworker.js", publicRoot), { scope: publicRoot.pathname });
        if (!navigator.serviceWorker.controller) {
          await navigator.serviceWorker.ready;
          location.reload();
        } else if (sessionStorage.getItem("dolly-isolation-retry") !== "1") {
          sessionStorage.setItem("dolly-isolation-retry", "1");
          location.reload();
        } else {
          document.querySelector("#bootstrap-log").textContent =
            "FATAL\nDolly could not establish cross-origin isolation.\n";
          document.documentElement.dataset.dollyStatus = "failed";
        }
      } else {
        document.querySelector("#bootstrap-log").textContent =
          "FATAL\nDolly requires cross-origin isolation and service workers are unavailable.\n";
        document.documentElement.dataset.dollyStatus = "failed";
      }
    </script>
  </body>
</html>
