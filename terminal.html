<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Dolly</title>
    <style>
      @font-face {
        font-family: "Dolly IosevkaTerm SemiBold";
        src: url("{{DOLLY_BASE}}dist/IosevkaTerm-SemiBold.woff2") format("woff2");
        font-style: normal;
        font-weight: 600;
        font-display: block;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #262626;
        color: #e8e3d7;
        font-family: "Dolly IosevkaTerm SemiBold", monospace;
      }
      #terminal { width: 100%; height: 100%; }
      #terminal > pre { margin: 1rem; white-space: pre-wrap; font: 600 20px/1.35 monospace; }
    </style>
  </head>
  <body>
    <main id="terminal" aria-label="Dolly shell terminal"><pre id="bootstrap-log"></pre></main>
    <script>globalThis.DOLLY_BOOT = Object.freeze({ image: "{{DOLLY_IMAGE}}", mode: "{{DOLLY_MODE}}", loadSession: {{DOLLY_LOAD_SESSION}} });</script>
    <script type="module">
      const assets = new URL("{{DOLLY_BASE}}", document.baseURI);
      const terminal = document.querySelector("#terminal");
      const failed = text => {
        terminal.firstElementChild.textContent = `FATAL\n${text}\n`;
        document.documentElement.dataset.dollyStatus = "failed";
      };
      if (crossOriginIsolated) {
        sessionStorage.removeItem("dolly-isolation-retry");
        // The site is an embedding: it offers every host module this repository
        // builds, or those of them a test named before the page loaded, and
        // takes the test's settings once.
        const { DOLLY_BOOT: route, DOLLY_HOST_MODULES: named, DOLLY_HTTP_POLICY: policy, DOLLY_HTTP_RELAYS: relays } = globalThis;
        for (const name of ["DOLLY_HOST_MODULES", "DOLLY_HTTP_POLICY", "DOLLY_HTTP_RELAYS"]) delete globalThis[name];
        let bootRoute, hostManifests;
        try {
          [{ bootRoute }, { hostManifests }] = await Promise.all(["src/site.mjs", "host/manifests.mjs"]
            .map(path => import(new URL(path, assets).href)));
        } catch (error) {
          failed(`Dolly failed to load.\n${error instanceof Error ? error.stack ?? error.message : String(error)}`);
        }
        const modules = hostManifests?.filter(({ name, version }) => !named || named.includes(`${name}@${version}`))
          .map(({ url }) => url);
        // The route shows its own failure in the terminal.
        if (bootRoute) window.__dolly = await bootRoute(terminal, { ...route, images: assets.href, site: assets.href, modules,
          http: { policy, relays } }).catch(error => console.error(error));
      } else if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register(new URL("coi-serviceworker.js", assets), { scope: assets.pathname });
        if (!navigator.serviceWorker.controller) {
          await navigator.serviceWorker.ready;
          location.reload();
        } else if (sessionStorage.getItem("dolly-isolation-retry") !== "1") {
          sessionStorage.setItem("dolly-isolation-retry", "1");
          location.reload();
        } else {
          failed("Dolly could not establish cross-origin isolation.");
        }
      } else {
        failed("Dolly requires cross-origin isolation and service workers are unavailable.");
      }
    </script>
  </body>
</html>
