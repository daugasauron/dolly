<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {{DOLLY_ROUTE_HEAD}}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Dolly</title>
    <style>
      @font-face {
        font-family: "Dolly IosevkaTerm SemiBold";
        src: url("{{DOLLY_BASE}}dist/IosevkaTerm-SemiBold.woff2") format("woff2");
        font-style: normal;
        font-weight: 600;
        font-display: block;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #262626;
        color: #e8e3d7;
        font-family: "Dolly IosevkaTerm SemiBold", monospace;
      }
      #terminal {
        position: relative;
        width: 100%;
        height: 100%;
        outline: none;
        overflow: hidden;
        caret-color: transparent;
      }
      #display {
        display: block;
        width: 100%;
        height: 100%;
        cursor: text;
        touch-action: none;
      }
      #display[hidden] { display: none; }
      #keyboard {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        caret-color: transparent;
      }
      #bootstrap-log {
        position: absolute;
        inset: 0;
        z-index: 1;
        margin: 0;
        padding: 1rem 1.15rem;
        overflow: auto;
        white-space: pre-wrap;
        color: #e8e3d7;
        background: #262626;
        font: 600 20px/1.35 "Dolly IosevkaTerm SemiBold", monospace;
        scrollbar-width: thin;
        scrollbar-color: #f2d45c #262626;
      }
      #bootstrap-log[hidden] { display: none; }
      #session-status {
        position: fixed; right: 1rem; top: 1rem; z-index: 5;
        max-width: calc(100vw - 2rem); padding: 0.5rem 0.75rem;
        background: #262626; border: 1px solid #77736c; font-size: 14px;
      }
      #local-model { position: fixed; right: 0.6rem; top: 0.6rem; z-index: 6;
        background: #f2d45c; color: #262626; border: 1px solid currentColor; padding: 0.75rem;
        font: 600 15px/1.4 "Dolly IosevkaTerm SemiBold", monospace;
        width: min(340px, calc(100vw - 1.2rem)); max-height: calc(100vh - 1.2rem); overflow: auto; }
      #local-model[hidden], #local-model [hidden] { display: none; }
      #local-model header, #local-model li { display: flex; justify-content: space-between; gap: 1rem; }
      #local-model header { border-bottom: 1px solid currentColor; padding-bottom: 0.4rem; }
      #local-model ul { list-style: none; margin: 0.5rem 0; padding: 0; }
      #local-model li { padding: 0.2rem 0.35rem; cursor: pointer; }
      #local-model li:focus { outline: 1px dashed currentColor; outline-offset: -1px; }
      #local-model li[aria-checked="true"] span:first-child::after { content: " ✓"; }
      #local-model li[aria-disabled="true"] { cursor: default; }
      #local-model p { margin: 0.5rem 0 0; }
      @media (max-width: 640px) {
        #bootstrap-log { padding: 0.65rem 0.75rem; }
      }
    </style>
  </head>
  <body>
    <main id="terminal" aria-label="Dolly shell terminal">
      <canvas id="display" hidden aria-label="Dolly sandbox framebuffer"></canvas>
      <textarea id="keyboard" aria-label="Dolly keyboard input"
        autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <pre id="bootstrap-log" aria-live="polite"></pre>
    </main>
    <div id="session-status" role="status" hidden></div>
    <script>globalThis.DOLLY_BOOT = Object.freeze({ image: "{{DOLLY_IMAGE}}", mode: "{{DOLLY_MODE}}", loadSession: {{DOLLY_LOAD_SESSION}} });</script>
    <script type="module">
      if (globalThis.DOLLY_NOT_FOUND) {
        document.body.textContent = "Not found. Return to the Dolly home page.";
      } else if (crossOriginIsolated) {
        sessionStorage.removeItem("dolly-isolation-retry");
        try {
          await import(new URL("{{DOLLY_BASE}}src/browser.mjs", document.baseURI).href);
        } catch (error) {
          const detail = error instanceof Error
            ? error.stack ?? error.message
            : String(error);
          document.querySelector("#bootstrap-log").textContent =
            `FATAL\nDolly failed to load.\n${detail}\n`;
          document.documentElement.dataset.dollyStatus = "failed";
        }
      } else if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register("{{DOLLY_BASE}}coi-serviceworker.js", { scope: "{{DOLLY_BASE}}" });
        if (!navigator.serviceWorker.controller) {
          await navigator.serviceWorker.ready;
          location.reload();
        } else if (sessionStorage.getItem("dolly-isolation-retry") !== "1") {
          sessionStorage.setItem("dolly-isolation-retry", "1");
          location.reload();
        } else {
          document.querySelector("#bootstrap-log").textContent =
            "FATAL\nDolly could not establish cross-origin isolation.\n";
          document.documentElement.dataset.dollyStatus = "failed";
        }
      } else {
        document.querySelector("#bootstrap-log").textContent =
          "FATAL\nDolly requires cross-origin isolation and service workers are unavailable.\n";
        document.documentElement.dataset.dollyStatus = "failed";
      }
    </script>
  </body>
</html>
