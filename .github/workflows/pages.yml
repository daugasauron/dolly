name: Deploy Dolly demo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the audited dolly-pages.tar.gz artifact
        required: true
        default: pages-latest
      artifact_sha256:
        description: SHA-256 printed by package-pages.sh for the audited artifact
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download audited browser build
        env:
          GH_TOKEN: ${{ github.token }}
          DOLLY_PAGES_RELEASE: ${{ inputs.release_tag }}
        run: gh release download "${DOLLY_PAGES_RELEASE}" --repo "${GITHUB_REPOSITORY}" --pattern dolly-pages.tar.gz
      - name: Verify audited artifact
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          [[ "${EXPECTED_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Expected a SHA-256 digest' >&2; exit 1; }
          printf '%s  dolly-pages.tar.gz\n' "${EXPECTED_SHA256}" | sha256sum --check --strict -
      - name: Extract browser build
        run: mkdir _site && tar -C _site -xzf dolly-pages.tar.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
