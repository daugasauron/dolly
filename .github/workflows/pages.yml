name: Deploy Dolly demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download audited browser build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pages-094e63af-r2 --repo "${GITHUB_REPOSITORY}" --pattern dolly-pages.tar.gz
      - name: Extract browser build
        run: mkdir _site && tar -C _site -xzf dolly-pages.tar.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
