name: Deploy Dolly demo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag (vX.Y.Z) whose release carries the audited dolly-pages.tar.gz artifact
        required: true
      artifact_sha256:
        description: SHA-256 of the audited artifact
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: _source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download audited browser build
        env:
          GH_TOKEN: ${{ github.token }}
          DOLLY_PAGES_RELEASE: ${{ inputs.release_tag }}
        run: gh release download "${DOLLY_PAGES_RELEASE}" --repo "${GITHUB_REPOSITORY}" --pattern dolly-pages.tar.gz
      - name: Verify audited artifact
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: bash _source/scripts/verify-sha256.sh "${EXPECTED_SHA256}" dolly-pages.tar.gz
      - name: Extract browser build
        run: mkdir _site && tar -C _site -xzf dolly-pages.tar.gz
      # The artifact records the commit it was packaged from: the tag's commit.
      - name: Verify complete release and source provenance
        run: node _source/scripts/site-release.mjs verify _site _source
      - uses: actions/configure-pages@v5
      - name: Export the version under its path
        env:
          DOLLY_PAGES_RELEASE: ${{ inputs.release_tag }}
        run: |
          node _source/scripts/export-static.mjs _site _static
          test -f "_static/${DOLLY_PAGES_RELEASE}/index.html"
      - name: Check deployment size
        run: |
          site_bytes="$(du -sb _static | cut -f1)"
          if (( site_bytes > 1000000000 )); then
            echo "dolly: Pages site exceeds 1 GB (${site_bytes} bytes)" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
