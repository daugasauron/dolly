
[env]
CFLAGS = "-O1"
# The release this Cargo commit shipped in, as Rust's own build passes it.
CFG_RELEASE = "1.98.1"
# SQLite's dot-file locks: its default locks are fcntl byte ranges, which Dolly
# does not have, and Cargo's cache tracker then fails on every run.
LIBSQLITE3_FLAGS = '-DSQLITE_DEFAULT_UNIX_VFS="unix-dotfile"'

# The image's libcurl (over the HTTP broker) and zlib, not the crates' bundled sources.
[target.wasm64-emscripten-probe.curl]
rustc-link-lib = ["curl"]

[target.wasm64-emscripten-probe.z]
rustc-link-lib = ["z"]
