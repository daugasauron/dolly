<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- SPDX-License-Identifier: MIT -->
<!-- fontconfig's own configuration prefers fonts this system does not have. Of those it has, Wine's Tahoma
     is the one for text: the others are symbols, screen fonts and the terminal's. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Tahoma</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Tahoma</family></prefer></alias>
</fontconfig>
